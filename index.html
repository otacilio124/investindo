<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0A2E22" />
    <meta name="description" content="Investindo! transforma o aporte do mês em um plano claro." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Investindo!" />
    <link rel="icon" type="image/svg+xml" href="/marca/investindo-simbolo.svg" />
    <link rel="apple-touch-icon" href="/marca/icone-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112.5,800;112.5,900&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    />
    <title>Investindo!</title>
    <script>
      // Resgate: fica no próprio HTML (e não no JavaScript do app) para funcionar
      // justamente quando o app não consegue carregar, por exemplo num app
      // instalado preso a uma versão antiga em cache. Se um arquivo do app falhar
      // ou nada montar em 8 s, limpa o cache e o service worker e recarrega uma vez.
      (function () {
        var CHAVE = 'investindo:resgate';
        var feito = false;
        function resgatar() {
          if (feito || window.__investindoMontou) return;
          feito = true;
          try {
            if (sessionStorage.getItem(CHAVE)) return;
            sessionStorage.setItem(CHAVE, '1');
          } catch (e) {}
          var tarefas = [];
          if ('serviceWorker' in navigator) {
            tarefas.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
              return Promise.all(rs.map(function (r) { return r.unregister(); }));
            }));
          }
          if (window.caches) {
            tarefas.push(caches.keys().then(function (ks) {
              return Promise.all(ks.map(function (k) { return caches.delete(k); }));
            }));
          }
          Promise.all(tarefas).then(function () { location.reload(); }, function () { location.reload(); });
        }
        window.addEventListener('error', function (e) {
          var alvo = e.target;
          if (alvo && (alvo.tagName === 'SCRIPT' || alvo.tagName === 'LINK') && /\/assets\//.test(alvo.src || alvo.href || '')) resgatar();
        }, true);
        setTimeout(resgatar, 8000);
      })();
    </script>
    <style>
      /* Tela de abertura enquanto o JavaScript carrega (nunca uma tela preta vazia). */
      .abertura { min-height: 100vh; display: grid; place-items: center; background: #0A2E22; }
      .abertura img { width: 64px; height: 64px; animation: pulsar 1.6s ease-in-out infinite; }
      @keyframes pulsar { 50% { opacity: 0.55; } }
      @media (prefers-reduced-motion: reduce) { .abertura img { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="abertura"><img src="/marca/icone-192.png" alt="Carregando o Investindo!" /></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
