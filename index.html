<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0A2E22" />
    <meta name="description" content="Investindo! transforma o aporte do mês em um plano claro." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Investindo!" />
    <link rel="icon" type="image/svg+xml" href="/marca/investindo-simbolo.svg" />
    <link rel="apple-touch-icon" href="/marca/icone-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112.5,800;112.5,900&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
    />
    <title>Investindo!</title>
    <script>
      // Resgate: fica no próprio HTML (e não no JavaScript do app) para funcionar
      // justamente quando o app não consegue carregar, por exemplo num app
      // instalado preso a uma versão antiga em cache. Se um arquivo do app falhar
      // ou nada montar em 8 s, limpa o cache e o service worker e recarrega uma vez.
      (function () {
        var CHAVE = 'investindo:resgate';
        var feito = false;
        function resgatar() {
          if (feito || window.__investindoMontou) return;
          feito = true;
          try {
            if (sessionStorage.getItem(CHAVE)) return;
            sessionStorage.setItem(CHAVE, '1');
          } catch (e) {}
          var tarefas = [];
          if ('serviceWorker' in navigator) {
            tarefas.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
              return Promise.all(rs.map(function (r) { return r.unregister(); }));
            }));
          }
          if (window.caches) {
            tarefas.push(caches.keys().then(function (ks) {
              return Promise.all(ks.map(function (k) { return caches.delete(k); }));
            }));
          }
          Promise.all(tarefas).then(function () { location.reload(); }, function () { location.reload(); });
        }
        window.addEventListener('error', function (e) {
          var alvo = e.target;
          if (alvo && (alvo.tagName === 'SCRIPT' || alvo.tagName === 'LINK') && /\/assets\//.test(alvo.src || alvo.href || '')) resgatar();
        }, true);
        setTimeout(resgatar, 8000);
      })();
    </script>
    <style>
      /* Tela de abertura enquanto o JavaScript carrega (nunca uma tela preta vazia).
         Mesma animação do componente Carregando (src/styles/visual.css), copiada
         aqui porque roda antes de qualquer CSS do app chegar. */
      html, body { margin: 0; background: #F3F5F4; }
      .abertura { position: fixed; inset: 0; z-index: 1000; background: #F3F5F4; display: grid; place-items: center; align-content: center; gap: 18px; transition: opacity 0.35s ease, transform 0.35s ease; }
      .abertura.saindo { opacity: 0; transform: scale(1.04); pointer-events: none; }
      .abertura-nome { font: 800 1.125rem/1 "Archivo", "Arial Black", sans-serif; font-stretch: 112.5%; letter-spacing: 0.04em; color: #0A2E22; }
      .abertura-nome b { color: #C9962B; }
      .abertura .sa-fundo { fill: #0A2E22; }
      .abertura .sa-1, .abertura .sa-2 { fill: #FFFFFF; }
      .abertura .sa-3, .abertura .sa-4 { fill: #C9962B; }
      .abertura .sa-barra { transform-box: fill-box; transform-origin: 50% 100%; animation: sa-subir 1.8s cubic-bezier(0.34, 1.4, 0.64, 1) infinite both; }
      .abertura .sa-2 { animation-delay: 0.12s; }
      .abertura .sa-3 { animation-delay: 0.24s; }
      .abertura .sa-4 { transform-origin: 50% 50%; animation-name: sa-ponto; animation-delay: 0.36s; }
      @keyframes sa-subir { 0% { transform: scaleY(0.12); opacity: 0.35; } 30%, 72% { transform: scaleY(1); opacity: 1; } 92%, 100% { transform: scaleY(0.12); opacity: 0.35; } }
      @keyframes sa-ponto { 0% { transform: scale(0); } 26%, 70% { transform: scale(1); } 90%, 100% { transform: scale(0); } }
      @media (prefers-color-scheme: dark) {
        html, body, .abertura { background: #070B09; }
        .abertura-nome { color: #ECF2EE; }
        .abertura-nome b { color: #E8B84A; }
        .abertura .sa-fundo { fill: #0E7A4B; }
        .abertura .sa-3, .abertura .sa-4 { fill: #E8B84A; }
      }
      @media (prefers-reduced-motion: reduce) { .abertura .sa-barra { animation: none; } }
    </style>
  </head>
  <body>
    <!-- Fora do #root: o React monta por baixo e o main.tsx tira a abertura
         quando o app tem o que mostrar, sempre com o símbolo completo. -->
    <div id="abertura" class="abertura" role="status" aria-label="Carregando o Investindo!">
      <svg viewBox="0 0 64 64" width="72" height="72" aria-hidden="true">
        <rect class="sa-fundo" width="64" height="64" rx="6" />
        <rect class="sa-barra sa-1" x="10" y="36" width="12" height="16" />
        <rect class="sa-barra sa-2" x="26" y="24" width="12" height="28" />
        <rect class="sa-barra sa-3" x="42" y="10" width="12" height="26" />
        <rect class="sa-barra sa-4" x="42" y="40" width="12" height="12" />
      </svg>
      <span class="abertura-nome">INVESTINDO<b>!</b></span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
